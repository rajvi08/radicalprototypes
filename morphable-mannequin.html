<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morphable Mannequin — radical_prototypes</title>
    <meta
      name="description"
      content="Morphable Mannequin — slide through current development, the research timeline, and the future vision. Beyond Mass Production."
    />

    <link href="https://fonts.cdnfonts.com/css/manolo-mono" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        cursor: auto;
        overflow: hidden;
        height: 100vh;
      }

      .mm {
        position: relative;
        z-index: 1;
        max-width: 1120px;
        margin: 0 auto;
        padding: clamp(24px, 4vh, 44px) var(--gutter) clamp(24px, 4vh, 44px);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      .mm__back {
        align-self: flex-start;
        color: var(--ink-soft);
        border-bottom: 1px solid var(--ink-line);
        padding-bottom: 2px;
        transition: color 0.3s var(--ease), border-color 0.3s var(--ease);
      }
      .mm__back:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      /* carousel with side arrows */
      .mm__carousel {
        position: relative;
        display: flex;
        align-items: center;
        flex: 1;
        min-height: 0;
        margin-top: clamp(16px, 2.5vh, 28px);
      }
      .mm__viewport {
        overflow: hidden;
        width: 100%;
        flex: 1;
        min-height: 0;
      }
      .mm__track {
        display: flex;
        width: 100%;
        height: 100%;
        transition: transform 0.55s var(--ease-out);
        will-change: transform;
      }
      .mm__panel {
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        overflow: hidden;
        padding: 4px clamp(2px, 1vw, 16px) 4px 2px;
      }

      .mm__stage-tag {
        display: inline-block;
        color: var(--ink);
        background: var(--hl);
        padding: 4px 10px;
        font-weight: 500;
      }
      .mm__panel-title {
        margin: 16px 0 0;
        font-family: var(--font-display);
        font-size: clamp(24px, 3.4vw, 42px);
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--ink);
        line-height: 1.05;
      }

      .mm__panel-grid {
        margin-top: clamp(20px, 3vh, 36px);
        display: grid;
        grid-template-columns: minmax(0, 300px) 1fr;
        gap: clamp(24px, 4vw, 56px);
        align-items: start;
      }
      .mm__media {
        width: 100%;
        border: 1px solid var(--ink-line);
        background: rgba(255, 255, 255, 0.5);
        overflow: hidden;
      }
      .mm__media img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 42vh;
        object-fit: contain;
      }
      .mm__copy p {
        margin: 0 0 16px;
        font-size: clamp(15px, 1.4vw, 19px);
        line-height: 1.55;
        color: var(--ink-2);
        max-width: 62ch;
      }
      .mm__copy p:first-child {
        color: var(--ink);
        font-size: clamp(16px, 1.5vw, 21px);
      }

      .mm__tags {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 24px 0 0;
        padding: 0;
      }
      .mm__tags li {
        border: 1px solid var(--ink-line);
        padding: 6px 12px;
        border-radius: 999px;
        color: var(--ink-soft);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.02em;
      }

      /* research timeline */
      .mm__timeline {
        list-style: none;
        margin: clamp(24px, 3vh, 40px) 0 0;
        padding: 0 0 0 26px;
        border-left: 1px solid var(--ink-line);
        max-width: 760px;
      }
      .mm__timeline li {
        position: relative;
        padding: 0 0 clamp(22px, 3vh, 34px);
      }
      .mm__timeline li::before {
        content: "";
        position: absolute;
        left: -31px;
        top: 4px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--hl);
        border: 1px solid var(--ink);
      }
      .mm__timeline .mm__when {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.72rem;
        color: var(--ink-faint);
      }
      .mm__timeline h3 {
        margin: 6px 0 4px;
        font-size: clamp(17px, 1.8vw, 23px);
        font-weight: 500;
        letter-spacing: -0.015em;
        color: var(--ink);
      }
      .mm__timeline p {
        margin: 0;
        font-size: clamp(14px, 1.3vw, 17px);
        color: var(--ink-soft);
        line-height: 1.5;
        max-width: 60ch;
      }

      .mm__panel-title--future {
        font-size: clamp(18px, 2.2vw, 26px);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .mm__timeline-img {
        margin-top: clamp(18px, 2.5vh, 32px);
      }
      .mm__timeline-img img {
        display: block;
        width: 100%;
        max-width: 82%;
        height: auto;
        max-height: 58vh;
        object-fit: contain;
        object-position: left center;
      }
      .mm__gallery {
        margin-top: clamp(20px, 3vh, 40px);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(14px, 2vw, 28px);
      }
      .mm__shot {
        margin: 0;
      }
      .mm__shot img {
        display: block;
        width: 100%;
        height: clamp(160px, 34vh, 320px);
        object-fit: cover;
        border: 1px solid var(--ink-line);
        background: rgba(255, 255, 255, 0.5);
      }

      /* Day 0 concept sequence — smaller and zoomed out so the text shows */
      .mm__gallery--seq .mm__shot img {
        height: clamp(150px, 30vh, 280px);
        object-fit: contain;
      }
      .mm__shot figcaption {
        margin-top: 8px;
        color: var(--ink-faint);
      }

      .mm__vision {
        max-width: 820px;
      }
      .mm__vision p {
        margin: 0 0 18px;
        font-size: clamp(18px, 2vw, 28px);
        line-height: 1.4;
        letter-spacing: -0.015em;
        color: var(--ink);
      }
      .mm__vision p.mm__vision-sub {
        font-size: clamp(15px, 1.4vw, 19px);
        line-height: 1.55;
        color: var(--ink-soft);
      }

      /* side navigation arrows */
      .mm__arrow {
        appearance: none;
        flex: none;
        width: 44px;
        height: 44px;
        border: 1px solid var(--ink-line);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.7);
        color: var(--ink);
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
        transition: border-color 0.3s var(--ease), background 0.3s var(--ease),
          opacity 0.3s var(--ease), transform 0.3s var(--ease);
      }
      .mm__arrow:hover:not(:disabled) {
        border-color: var(--ink);
        background: var(--hl-soft);
        transform: scale(1.06);
      }
      .mm__arrow:disabled {
        opacity: 0.25;
        cursor: default;
      }
      .mm__arrow--prev {
        margin-right: clamp(12px, 2vw, 24px);
      }
      .mm__arrow--next {
        margin-left: clamp(12px, 2vw, 24px);
      }

      /* heading below the carousel */
      .mm__foot {
        flex: none;
        min-height: 14vh;
        display: flex;
        align-items: center;
      }
      .mm__title {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(20px, 2.4vw, 30px);
        line-height: 1.1;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--ink);
        text-transform: lowercase;
      }

      @media (max-width: 720px) {
        .mm__panel-grid {
          grid-template-columns: 1fr;
        }
        .mm__media {
          max-width: 300px;
        }
        .mm__arrow {
          width: 36px;
          height: 36px;
          font-size: 0.95rem;
        }
        .mm__arrow--prev {
          margin-right: 8px;
        }
        .mm__arrow--next {
          margin-left: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main class="mm" id="mm">
      <a class="mm__back mono" href="index.html">← back to radical_prototypes</a>

      <div class="mm__carousel">
        <button
          class="mm__arrow mm__arrow--prev"
          id="mm-prev"
          type="button"
          aria-label="Previous section"
          disabled
        >
          ←
        </button>

        <div class="mm__viewport">
          <div class="mm__track" id="mm-track">
            <!-- PART 1 — OUR PROPOSAL -->
            <section class="mm__panel" aria-label="Our proposal">
              <h2 class="mm__panel-title mm__panel-title--future">Hyper-Personalized Experienced</h2>
              <div class="mm__gallery mm__gallery--seq">
                <figure class="mm__shot">
                  <img src="content/WALK-IN BODY SCAN (1).png" alt="Walk-in body scan" />
                  <figcaption class="mono">walk-in body scan</figcaption>
                </figure>
                <figure class="mm__shot">
                  <img src="content/MORPHABLE SURFACE.png" alt="Morphable surface" />
                  <figcaption class="mono">morphable surface</figcaption>
                </figure>
                <figure class="mm__shot">
                  <img src="content/SPRAY-ON WEAR.png" alt="Spray-on wear" />
                  <figcaption class="mono">spray-on wear</figcaption>
                </figure>
              </div>
            </section>

            <!-- PART 2 — VISION -->
            <section class="mm__panel" aria-label="Vision">
              <h2 class="mm__panel-title mm__panel-title--future">Future Vision</h2>

              <div class="mm__gallery">
                <figure class="mm__shot">
                  <img src="content/concept_video.gif" alt="Concept video" />
                  <figcaption class="mono">concept video</figcaption>
                </figure>
                <figure class="mm__shot">
                  <img src="content/future.png" alt="Future application" />
                  <figcaption class="mono">future</figcaption>
                </figure>
                <figure class="mm__shot">
                  <img src="content/instore.png" alt="In-store experience" />
                  <figcaption class="mono">in-store</figcaption>
                </figure>
              </div>
            </section>
          </div>
        </div>

        <button
          class="mm__arrow mm__arrow--next"
          id="mm-next"
          type="button"
          aria-label="Next section"
        >
          →
        </button>
      </div>

      <div class="mm__foot">
        <h1 class="mm__title"><span class="em">Morphable Mannequin</span></h1>
      </div>
    </main>

    <script>
      (() => {
        const track = document.getElementById("mm-track");
        const prev = document.getElementById("mm-prev");
        const next = document.getElementById("mm-next");
        const MAX = 1;
        let index = 0;

        const goTo = (i) => {
          index = Math.max(0, Math.min(MAX, i));
          track.style.transform = `translateX(${-index * 100}%)`;
          prev.disabled = index === 0;
          next.disabled = index === MAX;
        };

        prev.addEventListener("click", () => goTo(index - 1));
        next.addEventListener("click", () => goTo(index + 1));

        goTo(0);
      })();
    </script>
  </body>
</html>
