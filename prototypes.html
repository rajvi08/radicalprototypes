<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RADICAL PROTOTYPES</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f7f7f7;
        color: #1c1c1c;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .site-header {
        flex: none;
        width: 100%;
        height: 72px;
        background: #f7f7f7;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border-bottom: 1px solid #c8c8c8;
      }

      .site-header a {
        display: flex;
        align-items: center;
        line-height: 0;
        text-decoration: none;
        border: 0;
        outline: none;
      }

      .site-header img {
        display: block;
        height: 68px;
        width: auto;
        max-width: 100%;
      }

      main {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: #f7f7f7;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 28px;
      }

      .stage {
        width: 820px;
        height: 360px;
      }

      .frames {
        width: 820px;
        height: 360px;
        display: flex;
        gap: 18px;
      }

      .frames[hidden] {
        display: none !important;
      }

      .fill {
        position: relative;
        flex: 1;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 0;
        background: #d0d0d0;
        overflow: hidden;
        cursor: pointer;
        text-align: left;
        font: inherit;
        color: inherit;
      }

      .fill:focus-visible {
        outline: 1px solid #111111;
        outline-offset: 2px;
      }

      .fill img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .card__veil {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
        padding: 18px 16px;
        background: rgba(17, 17, 17, 0.62);
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .fill:hover .card__veil,
      .fill:focus-visible .card__veil {
        opacity: 1;
      }

      .card__title,
      .card__line {
        margin: 0;
      }

      .card__title {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.15;
      }

      .card__line {
        font-size: 14px;
        line-height: 1.3;
      }

      .detail {
        box-sizing: border-box;
        width: 820px;
        height: 360px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 28px 36px 22px;
        overflow: auto;
        background: #e6e6e6;
        border: 1px solid #c8c8c8;
        color: #1a1a1a;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 200;
        position: relative;
      }

      .detail[hidden] {
        display: none !important;
      }

      .detail__close {
        position: absolute;
        top: 10px;
        right: 12px;
        padding: 0;
        border: 0;
        background: transparent;
        color: #3a3a3a;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 200;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }

      .detail__close:hover,
      .detail__close:active,
      .detail__close:focus-visible {
        color: #000000;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .detail__title {
        margin: 0;
        padding-right: 48px;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
      }

      .detail__desc {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
      }

      .detail__note {
        margin: auto 0 0;
        font-size: 12px;
        line-height: 1.4;
      }

      .detail__mail {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .page-foot {
        flex: none;
        width: 100%;
        height: 74px;
        display: flex;
        flex-direction: column;
        background: #f7f7f7;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        line-height: 1.2;
        color: #3a3a3a;
      }

      .page-foot__wide {
        position: relative;
        flex: none;
        width: 100%;
        height: 54px;
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 0;
        background: #f7f7f7;
        border-top: 1px solid #c8c8c8;
        border-bottom: 1px solid #c8c8c8;
      }

      .page-foot__narrow {
        position: relative;
        flex: none;
        width: 100%;
        height: 20px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        min-width: 0;
        padding: 8px 0 0;
        background: #f7f7f7;
      }

      .page-foot__copy {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 400;
        font-size: 9px;
        line-height: 1;
        color: #3a3a3a;
      }

      .page-foot__links {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: stretch;
      }

      .page-foot__links a + a {
        border-left: 1px solid #c8c8c8;
      }

      .page-foot a {
        pointer-events: auto;
        color: #3a3a3a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        text-decoration: none;
      }

      .page-foot__links a {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 200;
        font-size: 21px;
        line-height: 1;
        letter-spacing: 0.04em;
        color: #000000;
      }

      .page-foot__links a[aria-current="page"] {
        color: #000000;
      }

      .page-foot__links a:hover,
      .page-foot__links a:focus-visible,
      .page-foot__links a[aria-current="page"]:hover,

      @media (max-width: 768px) {
        .site-header {
          height: 60px;
        }

        .site-header img {
          height: 48px;
        }

        .page-foot__links a {
          font-family: Arial, Helvetica, sans-serif;
          font-weight: 200;
          font-size: 14px;
          letter-spacing: 0.02em;
          padding: 0 4px;
        }

        main {
          flex-direction: column;
          align-items: center;
          padding: 10px 0;
        }

        .stage {
          width: calc(100% - 48px);
          height: 100%;
          min-height: 0;
          display: flex;
          flex-direction: column;
        }

        .frames {
          width: 100%;
          flex: 1 1 auto;
          min-height: 0;
          height: auto;
          flex-direction: column;
          flex-wrap: nowrap;
          gap: 8px;
        }

        .fill {
          flex: 1 1 0;
          width: 100%;
          height: auto;
          min-height: 0;
          max-height: 160px;
        }

        .fill img {
          object-fit: cover;
          object-position: center;
        }

        .card__veil {
          font-family: Arial, Helvetica, sans-serif;
          padding: 8px 6px;
          gap: 4px;
        }

        .card__title {
          font-size: 12px;
        }

        .card__line {
          font-size: 11px;
        }

        .detail {
          width: 100%;
          height: auto;
          aspect-ratio: 3 / 4;
          max-height: calc(100dvh - 160px);
          padding: 22px 16px 16px;
          font-family: Arial, Helvetica, sans-serif;
        }

        .detail__title {
          font-size: 16px;
        }

        .detail__desc {
          font-size: 14px;
        }

        .detail__note {
          font-size: 11px;
        }
      }

  <body>
    <header class="site-header">
      <a href="index.html"><img src="assets/logontypo.png" alt="RADICAL PROTOTYPES" /></a>
    </header>
    <main>
      <div class="stage">
        <div class="frames">
          <button
            type="button"
            class="fill"
            data-desc="Programmable materials explore how changes in geometry and structural configuration can alter a material system's macroscopic properties. By investigating the relationship between geometry, mechanical behaviour, and material response, we aim to develop adaptable structures with applications across multiple fields. Current research includes an ongoing collaboration with a New York City based company."
          >
            <img src="assets/materials.png" alt="" />
            <span class="card__veil">
              <span class="card__title">Programmable Materials</span>
              <span class="card__line">Engineering material properties through geometric transformation.</span>
            </span>
          </button>
          <button
            type="button"
            class="fill"
            data-desc="Modulon explores multifunctional, modular systems designed to enable closed-loop environments that reduce dependence on external resource supplies. Through adaptable, plug-and-play components, the research investigates how the built environment can support its own needs while enabling resources to circulate within interconnected systems. Current development includes a collaboration with a real estate company in Pune, India."
          >
            <img src="assets/modulon.png" alt="" />
            <span class="card__veil">
              <span class="card__title">Modulon</span>
              <span class="card__line">Closed loop systems for buildings.</span>
            </span>
          </button>
          <button
            type="button"
            class="fill"
            data-desc="Morphables investigates adaptive surfaces capable of changing their geometry in response to controlled actuation. The research explores the relationship between surface architecture, deformation mechanisms, and shape transformation to enable structures that can transition between different configurations. Intellectual property development is currently underway."
          >
            <img src="assets/mannquin.png" alt="" />
            <span class="card__veil">
              <span class="card__title">Morphables</span>
              <span class="card__line">Shape changing surfaces</span>
            </span>
          </button>
        </div>
        <article class="detail" hidden>
          <button type="button" class="detail__close">Close</button>
          <h2 class="detail__title"></h2>
          <p class="detail__desc"></p>
          <p class="detail__note">Some aspects of our research are confidential and subject to intellectual property protections and non-disclosure agreements. For further technical details please <a class="detail__mail" href="mailto:hi@radicalprototypes.com">contact us via email</a>.</p>
        </article>
      </div>
    </main>
    <footer class="page-foot">
      <div class="page-foot__wide">
        <nav class="page-foot__links" aria-label="Page">
          <a href="about.html">About</a>
          <a href="prototypes.html" aria-current="page">Prototypes</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
      <div class="page-foot__narrow">
        <p class="page-foot__copy">Radical Prototypes © 2026</p>
      </div>
    </footer>
    <script>
      const frames = document.querySelector(".frames");
      const detail = document.querySelector(".detail");
      const detailTitle = detail.querySelector(".detail__title");
      const detailDesc = detail.querySelector(".detail__desc");
      const closeDetailButton = detail.querySelector(".detail__close");
      let opener = null;

      function openDetail(button) {
        opener = button;
        detailTitle.textContent = button.querySelector(".card__title").textContent;
        detailDesc.textContent = button.dataset.desc;
        frames.hidden = true;
        detail.hidden = false;
        closeDetailButton.focus();
      }

      function closeDetail() {
        detail.hidden = true;
        frames.hidden = false;
        if (opener) opener.focus();
      }

      document.querySelectorAll(".fill").forEach((button) => {
        button.addEventListener("click", () => openDetail(button));
      });
      closeDetailButton.addEventListener("click", closeDetail);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !detail.hidden) closeDetail();
      });
    </script>
  </body>
